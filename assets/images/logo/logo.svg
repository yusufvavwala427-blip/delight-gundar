<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#C9A227" />
      <stop offset="70%" stop-color="#A67C00" />
      <stop offset="100%" stop-color="#E8D48A" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#E8D48A" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A67C00" stop-opacity="0.2" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon: Luxury Crystal Gem & Crown Motif -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Diamond -->
    <polygon points="37,2 72,37 37,72 2,37" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" />
    <!-- Inner Rotated Square -->
    <polygon points="37,9 65,37 37,65 9,37" fill="#3B2A1A" fill-opacity="0.4" stroke="#E8D48A" stroke-width="1.2" stroke-dasharray="3,2" />
    
    <!-- Stylized Gundar Crystal Facets -->
    <polygon points="37,16 58,37 37,58 16,37" fill="url(#goldGradient)" fill-opacity="0.25" stroke="url(#goldGradient)" stroke-width="1.5" />
    <polygon points="37,22 47,37 37,47 27,37" fill="url(#goldGradient)" />
    
    <!-- Delicate Corner Dots -->
    <circle cx="37" cy="5" r="2.5" fill="#E8D48A" />
    <circle cx="69" cy="37" r="2.5" fill="#E8D48A" />
    <circle cx="37" cy="69" r="2.5" fill="#E8D48A" />
    <circle cx="5" cy="37" r="2.5" fill="#E8D48A" />
  </g>

  <!-- Text Group -->
  <g transform="translate(98, 12)">
    <!-- Brand Title: DELIGHT GUNDAR -->
    <text x="0" y="34" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="4" fill="url(#goldGradient)" filter="url(#softGlow)">DELIGHT</text>
    <text x="175" y="34" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="4" fill="#FFF9EB">GUNDAR</text>
    
    <!-- Elegant Divider Line -->
    <line x1="0" y1="46" x2="335" y2="46" stroke="url(#goldGlow)" stroke-width="1.5" />
    <polygon points="167,43 171,46 167,49 163,46" fill="#C9A227" />

    <!-- Subtitle / Tagline -->
    <text x="2" y="62" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.8" fill="#E8D48A">PURE • TRADITIONAL • PREMIUM EDIBLE GUM</text>
  </g>
</svg>
